name: Keep Supabase project active

on:
  schedule:
    # Runs every 3 days at 06:00 UTC — well under Supabase's ~7-day inactivity pause window
    - cron: "0 6 */3 * *"
  workflow_dispatch: {} # lets you trigger it manually from the GitHub Actions tab too

jobs:
  ping-supabase:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Supabase Storage API
        run: |
          curl -s -o /dev/null -w "%{http_code}" \
            "${{ secrets.SUPABASE_URL }}/storage/v1/bucket/${{ secrets.SUPABASE_BUCKET }}" \
            -H "apikey: ${{ secrets.SUPABASE_SERVICE_KEY }}" \
            -H "Authorization: Bearer ${{ secrets.SUPABASE_SERVICE_KEY }}"